name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q trendclip tests
      - run: node --check dashboard/app.js
      - name: Validate macOS/Linux launchers
        if: runner.os != 'Windows'
        run: sh -n setup-trendclip.sh start-trendclip.sh
      - name: Validate Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @("Setup TrendClip Studio.ps1", "Start TrendClip Studio.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$parseErrors) > $null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) { $allErrors | ForEach-Object { Write-Error $_ }; exit 1 }
