[project]
name = "trendclip-studio"
version = "0.5.0"
description = "A secure, topic-independent pipeline for original short-form trend videos"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "deep-translator>=1.11",
  "edge-tts>=6.1",
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "requests>=2.31",
  "yt-dlp[default]>=2026.10.21,<2026.10.26; python_version < '3.11'",
  "yt-dlp[default]>=2026.10.26; python_version >= '3.11'",
]

[project.scripts]
trendclip = "trendclip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trendclip*"]

